    <script>
function openSidebar() {
    const sidebar = document.getElementById('sidebarMenu');
    const overlay = document.getElementById('sidebarOverlay');
    const mainArea = document.getElementById('mainWrapper');

    if (window.innerWidth <= 768) {
        // Mode Mobile
        sidebar.classList.add('open');
        overlay.classList.add('active');
    } else {
        // Mode Desktop
        sidebar.classList.toggle('closed');
        mainArea.classList.toggle('full-width');
    }
}

function closeSidebar() {
    document.getElementById('sidebarMenu').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('active');
}
    </script>

    <!-- Panggil jQuery jika belum ada -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function() {
  $("#supermag-pro-load-more-link").on("click", function(e) {
    e.preventDefault();
    var loadMoreUrl = $(this).attr("href");
    
    $(this).hide(); // Sembunyikan tombol saat loading
    $("#blog-pager .loading").show(); // Tampilkan loader
    
    $.ajax({
      url: loadMoreUrl,
      success: function(data) {
        // Cari konten baru di dalam .blog-posts
        var newPosts = $(data).find(".blog-posts");
        
        // Tambahkan animasi ke item baru
        newPosts.find(".index-post").addClass("post-animated post-fadeInUp");
        
        // Masukkan item baru ke dalam grid yang sudah ada
        $(".blog-posts").append(newPosts.html());
        
        // Cari link "Next Page" dari data yang baru diambil
        var nextPageLink = $(data).find("#supermag-pro-load-more-link");
        
        $("#blog-pager .loading").hide(); // Sembunyikan loader
        
        if (nextPageLink.length) {
          // Jika masih ada halaman berikutnya, update URL tombol dan tampilkan lagi
          $("#supermag-pro-load-more-link").attr("href", nextPageLink.attr("href")).show();
        } else {
          // Jika sudah habis, tampilkan pesan "That is All"
          $("#supermag-pro-load-more-link").hide();
          $("#blog-pager .no-more").addClass("show");
        }
      },
      error: function() {
        $("#supermag-pro-load-more-link").show();
        $("#blog-pager .loading").hide();
      }
    });
  });
});
</script>
    <script>
    // Fungsi untuk membuka tutup bar pencarian
    function toggleSearch() {
        document.getElementById('searchWrap').classList.toggle('active');
        document.getElementById('searchInput').focus();
    }

    // Fungsi jika tombol kaca pembesar diklik
    function submitSearch() {
        const wrap = document.getElementById('searchWrap');
        const input = document.getElementById('searchInput');
        
        if (!wrap.classList.contains('active')) {
            wrap.classList.add('active');
            input.focus();
        } else {
            if (input.value.trim() !== "") {
                window.location.href = "/search/?q=" + encodeURIComponent(input.value);
            } else {
                wrap.classList.remove('active');
            }
        }
    }

    // Fungsi jika menekan ENTER di keyboard
    function handleSearch(e) {
        if (e.key === 'Enter') {
            const val = document.getElementById('searchInput').value;
            if (val.trim() !== "") {
                window.location.href = "/search/?q=" + encodeURIComponent(val);
            }
        }
    }
</script>
