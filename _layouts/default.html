<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>

    <!-- Overlay untuk klik di luar sidebar (Mobile) -->
    <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebarMenu">
        <div class="sidebar-logo">
            <a href="/">
                <span class="live">LiveTV</span><span class="my">Malaysia</span>
            </a>
            <!-- Tombol Close khusus Mobile -->
            <button class="close-sidebar" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <nav class="nav-menu">
            <ul>
                <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="/category/live-tv-malaysia/"><i class="fa-solid fa-tv"></i> TV Malaysia</a></li>
                <li><a href="/category/live-tv-internasional/"><i class="fa-solid fa-globe"></i> International</a></li>
                <li><a href="/category/live-tv-sports/"><i class="fa-solid fa-volleyball"></i> TV Sports</a></li>
                <li><a href="/rakettv/"><i class="fa-solid fa-play"></i> Rakettv</a></li>
            </ul>
        </nav>
        <div style="padding: 20px; font-size: 10px; color: #444;">&copy; 2025 LIVETVMALAYSIA.SITE</div>
    </aside>

    <div class="main-content">
        <header class="header-top">
            <div class="header-inner">
                <button class="btn-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                
                <div class="search-box">
                    <div class="search-input-wrapper" id="searchWrap">
                        <input type="text" placeholder="Search channels..." id="searchInput">
                    </div>
                    <button class="btn-toggle" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
        </header>

        <!-- IKLAN DI BAWAH HEADER -->
        <div class="ads-placement">
            <div class="ads-container">
                <!-- Gunakan Client ID Anda -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-1555037532758037"
                     data-ad-slot="XXXXXXXXXX"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>
        </div>

        <main class="content-container">
            {{ content }}
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="/contact/">Contact</a>
                <a href="/disclaimer/">Disclaimer</a>
                <a href="/dmca/">DMCA</a>
                <a href="/privacy-policy/">Privacy Policy</a>
                <a href="/terms-conditions/">Terms & Conditions</a>
            </div>
            <p style="font-size: 11px; color: #999;">Watch Live TV Streaming Malaysia Online HD Free</p>
        </footer>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebarMenu').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }
        function toggleSearch() {
            document.getElementById('searchWrap').classList.toggle('active');
            document.getElementById('searchInput').focus();
        }
    </script>
</body>
</html>
