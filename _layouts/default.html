<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    {% include head.html %}
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Overlay untuk Mobile (Klik di luar sidebar untuk menutup) -->
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR FIXED -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <a href="/">
                <span class="live">LiveTV</span><span class="my">Malaysia</span>
            </a>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="/category/live-tv-malaysia/"><i class="fa-solid fa-tv"></i> TV Malaysia</a></li>
                <li><a href="/category/live-tv-internasional/"><i class="fa-solid fa-globe"></i> International</a></li>
                <li><a href="/category/live-tv-sports/"><i class="fa-solid fa-volleyball"></i> TV Sports</a></li>
                <li><a href="/rakettv/"><i class="fa-solid fa-play-circle"></i> Rakettv</a></li>
            </ul>
        </nav>
        <div style="padding: 20px; font-size: 11px; color: #444;">&copy; 2025 LiveTVMalaysia</div>
    </aside>

    <div class="main-content" id="mainArea">
        <header class="header-top">
            <div class="header-inner">
                <button class="btn-icon" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                
                <div class="search-box">
                    <div class="search-input-wrapper" id="searchWrap">
                        <input type="text" placeholder="Search..." id="channelSearch">
                    </div>
                    <button class="btn-icon" onclick="toggleSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
        </header>

        <!-- PENEMPATAN IKLAN BAWAH HEADER -->
        <div class="ads-placement-top">
            <div class="ads-wrapper">
                <!-- Google Adsense Code Start -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-XXXXXXXXXXXX"
                     data-ad-slot="XXXXXXXXX"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
                <!-- Google Adsense Code End -->
            </div>
        </div>

        <main class="container">
            {{ content }}
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="/contact/">Contact</a>
                <a href="/disclaimer/">Disclaimer</a>
                <a href="/dmca/">DMCA</a>
                <a href="/privacy-policy/">Privacy Policy</a>
                <a href="/terms-conditions/">Terms & Conditions</a>
            </div>
            <div class="copyright">
                &copy; {{ site.time | date: '%Y' }} {{ site.title }}
            </div>
        </footer>
    </div>

    <script>
        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            const ma = document.getElementById('mainArea');
            const ov = document.getElementById('overlay');
            
            if(window.innerWidth <= 768) {
                sb.classList.toggle('active');
                ov.classList.toggle('active');
            } else {
                sb.classList.toggle('closed');
                ma.classList.toggle('full-width');
            }
        }
        function toggleSearch() {
            document.getElementById('searchWrap').classList.toggle('active');
            document.getElementById('channelSearch').focus();
        }
    </script>
</body>
</html>
