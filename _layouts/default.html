<!DOCTYPE html>
<html lang="en">
<head>
    {% include head.html %}
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- Icon library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <a href="/">
                <span class="live">LiveTV</span><span class="my">Malaysia</span>
            </a>
        </div>
        
        <nav class="nav-menu">
            <ul>
                <li><a href="/" class="active"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="/category/live-tv-malaysia/"><i class="fa-solid fa-tv"></i> TV Malaysia</a></li>
                <li><a href="/category/live-tv-internasional/"><i class="fa-solid fa-globe"></i> International</a></li>
                <li><a href="/category/live-tv-sports/"><i class="fa-solid fa-volleyball"></i> Sports</a></li>
                <li><a href="/rakettv/"><i class="fa-solid fa-rocket"></i> Rakettv</a></li>
            </ul>
        </nav>
    </aside>

    <div class="main-content">
        <header class="header-top">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="align-self: center; color: #555;"></i>
                <input type="text" placeholder="Search for channels..." id="searchBox">
            </div>
        </header>

        {{ content }}

        <footer style="padding: 40px; text-align: center; color: #444; font-size: 13px;">
            &copy; {{ site.time | date: '%Y' }} LIVETVMALAYSIA.SITE - Free Streaming Directory
        </footer>
    </div>

</body>
</html>
