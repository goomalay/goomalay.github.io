<!DOCTYPE html>
<html lang="id">

{% include head.html %}

<body>
    <div class="wrapper">
        <!-- Sidebar Kiri -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-live">LiveTV</span><span class="logo-malaysia">Malaysia</span>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li class="{% if page.url == '/' %}active{% endif %}">
                        <a href="/"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li><a href="/category/malaysia"><i class="fas fa-tv"></i> TV Malaysia</a></li>
                    <li><a href="/category/internasional"><i class="fas fa-globe"></i> TV Internasional</a></li>
                    <li><a href="/category/sports"><i class="fas fa-running"></i> TV Sports</a></li>
                    <li><a href="/rakettv"><i class="fas fa-play-circle"></i> Rakettv</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Container Kanan -->
        <div class="main-container">
            <header class="header-top">
                <div class="search-container">
                    <form action="/search" method="get" class="search-bar">
                        <input type="text" name="q" placeholder="Cari saluran TV...">
                        <button type="submit"><i class="fas fa-search"></i></button>
                    </form>
                </div>
            </header>

            <main class="content">
                {{ content }}
            </main>

            <footer class="footer-bottom">
                <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All Rights Reserved.</p>
            </footer>
        </div>
    </div>

    <!-- Script untuk Search Bar Buka Tutup (Opsional) -->
    <script>
        // Tambahkan logic JS jika ingin search bar melebar saat diklik
    </script>
</body>
</html>
