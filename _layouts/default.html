<!DOCTYPE html>
<html lang="ms-MY">
<head>
    {% include head.html %}
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <!-- Sidebar Kiri -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <a href="/">
                <span class="logo-live">LiveTV</span><span class="logo-malaysia">Malaysia</span>
            </a>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="/"><i class="icon-home"></i> Home</a></li>
                <li><a href="/category/live-tv-malaysia/"><i class="icon-tv"></i> TV Malaysia</a></li>
                <li><a href="/category/live-tv-internasional/"><i class="icon-globe"></i> TV Internasional</a></li>
                <li><a href="/category/live-tv-sports/"><i class="icon-sport"></i> TV Sports</a></li>
                <li><a href="/rakettv/"><i class="icon-play"></i> Rakettv</a></li>
            </ul>
        </nav>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        
        <!-- Header Top -->
        <header class="top-header">
            <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Cari channel favorit..." onkeyup="searchChannel()">
                <button id="searchBtn">🔍</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            {{ content }}
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; {{ site.time | date: '%Y' }} LiveTVMalaysia.site - All Rights Reserved.</p>
        </footer>
    </div>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }
    </script>
</body>
</html>
