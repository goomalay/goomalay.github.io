<!DOCTYPE html>
<html lang="en">
<head>
    {% include head.html %}
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <a href="/">
                <span class="live">LiveTV</span><span class="my">Malaysia</span>
            </a>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="/category/live-tv-malaysia/"><i class="fa-solid fa-tv"></i> TV Malaysia</a></li>
                <li><a href="/category/live-tv-internasional/"><i class="fa-solid fa-globe"></i> International</a></li>
                <li><a href="/category/live-tv-sports/"><i class="fa-solid fa-volleyball"></i> Sports</a></li>
                <li><a href="/rakettv/"><i class="fa-solid fa-play"></i> Rakettv</a></li>
            </ul>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="top-header">
            <div class="search-box">
                <i class="fa-solid fa-search" style="color: #555;"></i>
                <input type="text" placeholder="Search channels..." id="channelSearch">
            </div>
        </header>

        <main>
            {{ content }}
        </main>

        <footer style="padding: 40px; text-align: center; color: #444; border-top: 1px solid #222;">
            <p>&copy; {{ site.time | date: '%Y' }} LIVETVMALAYSIA.SITE</p>
        </footer>
    </div>

</body>
</html>
