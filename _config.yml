# Site Settings
title: "Live TV Malaysia Online"
seo_title: "Live TV Malaysia Online - HD Streaming & 2026 Live Sports"
description: "Watch all Malaysian TV channels live online for free."
url: "https://www.livetvmalaysia.site"
baseurl: "" 

# Author & Language Settings
author: Admin TV Online
lang: en
permalink: /:title/

# Plugins (Hanya gunakan yang didukung standar)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Konfigurasi Pagination V1 (WAJIB SEPERTI INI)
paginate: 12
paginate_path: "/page:num/"

# Build settings
markdown: kramdown
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
