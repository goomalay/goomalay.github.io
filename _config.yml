# Site Settings
title: "Live TV Malaysia Online | Watch All Channels Free"
seo_title: "Live TV Malaysia Online - HD Streaming & 2026 Live Sports"
description: "Watch all Malaysian TV channels live online for free. Experience high-definition streaming of RTM, Media Prima, Astro, and international news with low-latency 5G optimization."
url: "https://www.livetvmalaysia.site"
baseurl: "" 

# Verification Codes
google_verify: "AClBoYkUfOFJsqDelDrrWx5Rs1KVVVOJQQlW0fiX_9A"
bing_verify: "2023033E7A81CF57AE17074D2DAC523D"

# Author & Language Settings
author: Admin TV Online
lang: en
permalink: /:title/

# Build settings
markdown: kramdown
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Plugins (Daftarkan di sini sekali saja)
plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap

# Konfigurasi Pagination V2 (Menggantikan paginate & paginate_path versi lama)
pagination:
  enabled: true
  per_page: 12
  permalink: "/page/:num/"
  title_suffix: " - Page :num"
  limit: 0
  sort_field: "date"
  sort_reverse: true
  # Fitur tambahan agar otomatis memproses halaman kategori
  index_page_before: ["index.html", "index.md"]
